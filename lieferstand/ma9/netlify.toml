[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify Image CDN: lokale Bilder werden automatisch skaliert (srcset) und als AVIF/WebP ausgeliefert.
# Externe Quellbilder nur von diesen Hosts (Feuerwehr, Heimat-Info, FUSSBALL.DE, Gemeinde, Kreis-Tourismus).
[images]
  remote_images = [
    "https://feuerwehr-merzenich\\.de/.*",
    "https://www\\.gemeinde-merzenich\\.de/.*",
    "https://www\\.tourismus\\.kreis-dueren\\.de/.*"
  ]

# Netlify Identity + Git Gateway für /admin/ (im Netlify-Dashboard einschalten, siehe README).

