# ERZEUGT - nicht von Hand bearbeiten.
# Quelle: chatgpt-site/_redirects und chatgpt-site/_headers
# Neu erzeugen: node deploy/coolify/erzeuge-nginx-conf.mjs

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml application/javascript application/json application/rss+xml application/atom+xml image/svg+xml text/calendar;

  # --- Weiterleitungen mit Platzhalter (aus _redirects) ---
  rewrite "^/stadtleben/(.*)$" /leben/$1 permanent;
  rewrite "^/newsletter/(.*)$" /whatsapp/ permanent;

  # --- Kopfzeilen fuer alle Antworten (aus _headers /*) ---
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

