# Umleitung der alten Vorschauadresse (merzenichaktuell.hk-growthoperator.de)
# auf die Live-Seite. Seit 05.10.2026 wird nur noch WordPress auf
# merzenich-aktuell.de ausgeliefert; die Vorschau antwortete danach mit 503.
# Jede Anfrage bekommt 301 mit gleichem Pfad und gleicher Abfrage.
# /gesund ist nur fuer die Gesundheitspruefung des Containers (204).
server {
  listen 80;
  server_name _;
  server_tokens off;
  access_log off;

  location = /gesund { return 204; }
  location / { return 301 https://merzenich-aktuell.de$request_uri; }
}
