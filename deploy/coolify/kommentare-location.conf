  # Kommentare und Diskussion: kleiner Node-Dienst im selben Container
  # (deploy/coolify/kommentare/server.mjs, gestartet von 50-kommentare.sh).
  # Same-origin, deshalb keine CSP-Aenderung noetig.
  location ~ ^/api/(kommentare|abo|formular)/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Wetter: Same-origin ueber den Dienst (Open-Meteo mit 10-Minuten-Cache).
  # Ersetzt den nginx-Proxy mit eigenem resolver aus weather-location.conf.
  location = /api/weather.json {
    proxy_pass http://127.0.0.1:8787/api/weather;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    add_header Cache-Control "public, max-age=600, stale-while-revalidate=1800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Bildproxy: Symbolbilder von Wikimedia Commons ueber den Dienst (Cache in
  # /data/bilder). Die Cache-Header setzt der Dienst selbst.
  location = /api/bild {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Redaktionsformulare (multipart mit Bildern bis 6 MB).
  location = /api/formular {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Referer $http_referer;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    client_max_body_size 13m;
    add_header Cache-Control "no-store" always;
  }
