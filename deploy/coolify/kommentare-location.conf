  # Kommentare und Diskussion: kleiner Node-Dienst im selben Container
  # (deploy/coolify/kommentare/server.mjs, gestartet von 50-kommentare.sh).
  # Same-origin, deshalb keine CSP-Aenderung noetig.
  location /api/kommentare/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
