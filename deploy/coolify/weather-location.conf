  # Wetter fuer Merzenich. Same-origin Proxy, damit die bestehende CSP unveraendert bleibt.
  # Der Browser spricht nur /api/weather.json an; Open-Meteo bleibt serverseitig.
  location = /api/weather.json {
    # Der Host steht bewusst in einer Variablen. Mit einem festen Namen in
    # proxy_pass loest nginx EINMAL beim Start auf und behaelt die Adresse fuer
    # die Lebensdauer des Containers. Open-Meteo liegt hinter einem CDN mit
    # wechselnden Adressen: sobald die IP rotiert, ist das Wetter stumm tot, bis
    # jemand neu deployt - und die QA-Strecke faellt dann auf einem voellig
    # unbeteiligten Commit um, weil sie den Ausfalltext verbietet.
    # Mit Variable plus resolver loest nginx pro Anfrage neu auf und respektiert
    # die TTL. Nebeneffekt: "nginx -t" im Docker-Build braucht keine DNS mehr.
    # Das "resolver" selbst steht in 00-resolver.conf und wird beim Start aus
    # /etc/resolv.conf des Containers erzeugt (deploy/coolify/40-resolver.sh).
    set $meteo_host api.open-meteo.com;

    proxy_pass https://$meteo_host/v1/forecast?latitude=50.8317&longitude=6.5361&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=3;
    proxy_ssl_server_name on;
    proxy_ssl_name api.open-meteo.com;
    proxy_set_header Host api.open-meteo.com;
    proxy_connect_timeout 4s;
    proxy_read_timeout 6s;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "public, max-age=600, stale-while-revalidate=1800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
