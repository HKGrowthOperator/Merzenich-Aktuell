  # Wetter fuer Merzenich. Same-origin Proxy, damit die bestehende CSP unveraendert bleibt.
  # Der Browser spricht nur /api/weather.json an; Open-Meteo bleibt serverseitig.
  location = /api/weather.json {
    proxy_pass https://api.open-meteo.com/v1/forecast?latitude=50.8317&longitude=6.5361&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=3;
    proxy_ssl_server_name on;
    proxy_set_header Host api.open-meteo.com;
    proxy_connect_timeout 4s;
    proxy_read_timeout 6s;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "public, max-age=600, stale-while-revalidate=1800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
