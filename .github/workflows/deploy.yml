# Veroeffentlicht den Stand von main auf GitHub Pages.
#
# Ausgeliefert wird das Wurzelverzeichnis: index.html, app.js, styles.css,
# content.json. Die Ordner wordpress/, wordpress-delivery/, docs/, qa/ und
# imports/ gehoeren nicht zur oeffentlichen Seite und werden vorher entfernt.
#
# Die Release-Gates laufen vorgeschaltet. Sind sie rot, wird nicht
# veroeffentlicht.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node qa/pruefung.mjs

  deploy:
    needs: gates
    # GitHub Pages ist fuer dieses Repo nicht aktiviert (Auslieferung laeuft ueber
    # Coolify). Bis Pages eingeschaltet ist, wuerde configure-pages jeden Push rot
    # faerben. Zum Aktivieren: Settings > Pages > Source "GitHub Actions", dann
    # Repository-Variable GITHUB_PAGES_AKTIV=ja setzen.
    if: vars.GITHUB_PAGES_AKTIV == 'ja'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Die ausgelieferte Seite uebernehmen
        # chatgpt-site/ ist der Stand, der oeffentlich laeuft: 212 Seiten mit
        # echten Adressen. Die index.html im Wurzelverzeichnis ist eine andere,
        # einzelne Seite und nicht das, was ausgeliefert wird.
        run: |
          test -f chatgpt-site/index.html
          cp -R chatgpt-site _site
          # Jekyll aus dem Weg raeumen, sonst werden Dateien mit Unterstrich verschluckt.
          touch _site/.nojekyll
          echo "Seiten: $(find _site -name index.html | wc -l)"
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
