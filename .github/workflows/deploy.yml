# Veroeffentlicht den Stand von main auf GitHub Pages.
#
# Ausgeliefert wird das Wurzelverzeichnis: index.html, app.js, styles.css,
# content.json. Die Ordner wordpress/, wordpress-delivery/, docs/, qa/ und
# imports/ gehoeren nicht zur oeffentlichen Seite und werden vorher entfernt.
#
# Die Release-Gates laufen vorgeschaltet. Sind sie rot, wird nicht
# veroeffentlicht.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node qa/pruefung.mjs

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Nur die oeffentliche Seite uebernehmen
        run: |
          mkdir -p _site
          cp index.html app.js styles.css content.json _site/
          # Jekyll aus dem Weg raeumen, sonst werden Dateien mit Unterstrich verschluckt.
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
