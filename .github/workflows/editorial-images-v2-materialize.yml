name: Materialize Editorial Image System V2

on:
  push:
    branches: [main]
    paths:
      - 'deploy/lib-symbolbilder.mjs'
      - 'deploy/symbolbilder.mjs'
      - 'deploy/import-editorial-photos.mjs'
      - 'deploy/editorial-photo-review.json'
      - 'deploy/bildmotive.json'
      - 'deploy/pool-varianten.py'
      - 'deploy/markt-prerender.mjs'
      - 'chatgpt-site/assets/bild-fallbacks.js'
      - '.github/workflows/editorial-images-v2-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-images-v2
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Import freely licensed editorial photos
        run: node deploy/import-editorial-photos.mjs

      - name: WebP-Varianten der Poolfotos (480/800/1200 px)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 deploy/pool-varianten.py

      - name: Generate image library and article assignments
        run: |
          node deploy/symbolbilder.mjs
          node deploy/markt-prerender.mjs
          node deploy/sport-prerender.mjs
          node deploy/suche-index.mjs
          node deploy/thema-prerender.mjs
          node deploy/teaser-bilder.mjs
          node deploy/ortsmarke.mjs
          node deploy/inhaltsindex.mjs
          node deploy/termine-prerender.mjs
          node deploy/kopf-theme-einbinden.mjs
          # Nachgelagerte Prerender-Schritte können Artikelseiten neu schreiben.
          # Deshalb das Bildsystem am Ende noch einmal materialisieren, damit
          # der finale Stand idempotent ist und die Foto-Zuordnung erhalten bleibt.
          node deploy/symbolbilder.mjs

      - name: Verify hard image-system invariants
        run: |
          node deploy/symbolbilder.mjs --check
          node deploy/teaser-bilder.mjs --check
          node deploy/ortsmarke.mjs --check
          python3 deploy/pool-varianten.py --check
          node --check chatgpt-site/assets/bild-fallbacks.js
          node qa/pruefung.mjs
          python3 - <<'PY'
          import json, pathlib, collections, sys
          root = pathlib.Path('chatgpt-site')
          lib = json.loads((root/'data/editorial-images/editorial-images.json').read_text())
          images = lib['images']
          required = ['sport','polizei','feuerwehr','verkehr','vereine','gemeinde','veranstaltungen','leben','wirtschaft','jobs','immobilien','familie','trauer','kultur','schule','kirche','aktuell','blaulicht','brand','termine','tipp','menschen']
          counts = collections.Counter(x['pool'] for x in images)
          for pool in required:
              assert counts[pool] >= 20, (pool, counts[pool])
          # Jeder Pool mindestens 20 Motive (oben). Pools mit Reservegrafiken
          # fuellen nicht mit ungeprueften Fotos auf, daher keine feste Summe 560.
          assert len(images) >= 20 * len(required), len(images)
          for x in images:
              for key in ['id','pool','src','alt','credit','source','license','rightsCheckedAt','tags','checksum']:
                  assert x.get(key), (x.get('id'), key)
              assert (root/x['src'].lstrip('/')).is_file(), x['src']
          ids = [x['id'] for x in images]
          assert len(ids) == len(set(ids)), 'duplicate ids'
          checksums = [x['checksum'] for x in images]
          assert len(checksums) == len(set(checksums)), 'exact image duplicate'
          assignments = json.loads((root/'data/editorial-images/editorial-image-assignments.json').read_text())['assignments']
          print('POOL COUNTS', dict(counts))
          print('TOTAL', len(images))
          print('ASSIGNMENTS', len(assignments))
          PY

      - name: Commit generated delivery state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A chatgpt-site
          if git diff --cached --quiet; then
            echo 'Nothing to materialize.'
            exit 0
          fi
          git commit -m 'build: materialize editorial image system v2 [skip ci]'
          # QA schreibt parallel auf main; bei abgelehntem Push neu holen und wiederholen.
          for versuch in 1 2 3 4; do
            git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main && exit 0
            sleep $((versuch * 7))
          done
          exit 1
