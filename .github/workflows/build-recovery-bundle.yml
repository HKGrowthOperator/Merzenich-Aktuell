name: Build recovery bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble frozen recovery bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/merzenich-recovery
          mkdir -p /tmp/merzenich-recovery/merzenich-recovery/qa/after
          mkdir -p /tmp/merzenich-recovery/merzenich-recovery/qa/before
          mkdir -p artifacts imports

          cp wordpress-delivery/merzenich-aktuell-theme.zip /tmp/merzenich-recovery/merzenich-aktuell-theme.zip
          cp wordpress-delivery/merzenich-aktuell-core.zip /tmp/merzenich-recovery/merzenich-aktuell-core.zip
          cp wordpress-delivery/merzenich-aktuell-import.xml /tmp/merzenich-recovery/merzenich-aktuell-import.xml
          cp wordpress-delivery/merzenich-aktuell-import.xml imports/merzenich-aktuell-import.xml

          cp docs/README-INSTALLATION-recovery-2026-09-14.md /tmp/merzenich-recovery/README-INSTALLATION.md
          cp docs/SPORT-UPDATE-2026-09-14.json /tmp/merzenich-recovery/SPORT-UPDATE-2026-09-14.json
          cp docs/CONTENT-REFRESH-2026-09-14.md /tmp/merzenich-recovery/CONTENT-REFRESH-2026-09-14.md
          cp docs/IMAGE-CANDIDATES.md /tmp/merzenich-recovery/IMAGE-CANDIDATES.md
          cp docs/QA-RECOVERY-2026-09-14.md /tmp/merzenich-recovery/QA-RECOVERY-2026-09-14.md
          cp docs/SHA256SUMS.txt /tmp/merzenich-recovery/SHA256SUMS.txt

          cp qa/after/*.png /tmp/merzenich-recovery/merzenich-recovery/qa/after/
          cp qa/before/NOT-AVAILABLE.txt /tmp/merzenich-recovery/merzenich-recovery/qa/before/

          (
            cd /tmp/merzenich-recovery
            zip -qr "$GITHUB_WORKSPACE/artifacts/merzenich-aktuell-recovery-2026-09-14.zip" .
          )

          sha256sum artifacts/merzenich-aktuell-recovery-2026-09-14.zip > artifacts/merzenich-aktuell-recovery-2026-09-14.sha256

      - name: Commit recovery archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/merzenich-aktuell-recovery-2026-09-14.zip artifacts/merzenich-aktuell-recovery-2026-09-14.sha256 imports/merzenich-aktuell-import.xml
          if git diff --cached --quiet; then
            echo 'No recovery bundle changes to commit.'
            exit 0
          fi
          git commit -m 'Store complete Merzenich recovery bundle'
          git push
