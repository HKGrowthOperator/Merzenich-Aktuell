name: Traueranzeigen aktualisieren

on:
  push:
    branches: [main]
    paths:
      - 'deploy/trauer-prerender.mjs'
      - 'traueranzeigen.json'
      - '.github/workflows/traueranzeigen.yml'
      - 'qa/pruefung.mjs'
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traueranzeigen
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Originalbilder und Seite aktualisieren
        run: node deploy/trauer-prerender.mjs
      - name: QA
        run: node qa/pruefung.mjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add traueranzeigen.json chatgpt-site/traueranzeigen/index.html
          if git diff --cached --quiet; then echo 'Nichts zu aendern.'; exit 0; fi
          git commit -m 'trauer: Originalbilder und verifizierte Anzeigen aktualisiert [skip ci]'
          for versuch in 1 2 3 4; do
            git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main && exit 0
            sleep $((versuch * 7))
          done
          exit 1
