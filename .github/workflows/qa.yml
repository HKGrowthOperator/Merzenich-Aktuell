name: Merzenich Aktuell QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Validate frontend JavaScript syntax
        run: |
          node --check app.js
          node --check app-fixes.js

      - name: Validate JSON content
        run: python3 -m json.tool content.json > /dev/null

      - name: Validate WordPress import XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('wordpress-delivery/merzenich-aktuell-import.xml'); print('WXR/XML syntax OK')"

      - name: Verify versioned WordPress source exists
        run: |
          test -f wordpress/theme/merzenich-aktuell/style.css
          test -f wordpress/theme/merzenich-aktuell/functions.php
          test -f wordpress/plugin/merzenich-aktuell-core/merzenich-aktuell-core.php

      - name: Lint versioned WordPress source
        run: |
          PHP_COUNT=$(find wordpress/theme/merzenich-aktuell wordpress/plugin/merzenich-aktuell-core -type f -name '*.php' | wc -l)
          if [ "$PHP_COUNT" -eq 0 ]; then
            echo 'ERROR: Versioned WordPress source contains no PHP files.'
            exit 1
          fi
          while IFS= read -r file; do php -l "$file"; done < <(find wordpress/theme/merzenich-aktuell wordpress/plugin/merzenich-aktuell-core -type f -name '*.php' -print)

      - name: Verify WordPress delivery files exist
        run: |
          test -s wordpress-delivery/merzenich-aktuell-theme.zip
          test -s wordpress-delivery/merzenich-aktuell-core.zip
          test -s wordpress-delivery/merzenich-aktuell-import.xml

      - name: Inspect and lint Theme ZIP
        run: |
          rm -rf /tmp/ma-theme
          mkdir -p /tmp/ma-theme
          unzip -q wordpress-delivery/merzenich-aktuell-theme.zip -d /tmp/ma-theme
          echo 'Theme ZIP contents:'
          find /tmp/ma-theme -maxdepth 3 -type f | sort
          PHP_COUNT=$(find /tmp/ma-theme -type f -name '*.php' | wc -l)
          if [ "$PHP_COUNT" -eq 0 ]; then
            echo 'ERROR: Theme ZIP contains no PHP files.'
            exit 1
          fi
          while IFS= read -r file; do php -l "$file"; done < <(find /tmp/ma-theme -type f -name '*.php' -print)

      - name: Inspect and lint Core Plugin ZIP
        run: |
          rm -rf /tmp/ma-core
          mkdir -p /tmp/ma-core
          unzip -q wordpress-delivery/merzenich-aktuell-core.zip -d /tmp/ma-core
          echo 'Core ZIP contents:'
          find /tmp/ma-core -maxdepth 4 -type f | sort
          PHP_COUNT=$(find /tmp/ma-core -type f -name '*.php' | wc -l)
          if [ "$PHP_COUNT" -eq 0 ]; then
            echo 'ERROR: Core ZIP contains no PHP files.'
            exit 1
          fi
          while IFS= read -r file; do php -l "$file"; done < <(find /tmp/ma-core -type f -name '*.php' -print)

      - name: Check for obvious placeholder delivery files
        run: |
          if grep -RniE 'TODO|dummy content|example only' /tmp/ma-theme /tmp/ma-core; then
            echo 'WARNING: Placeholder markers found. Review required.'
          else
            echo 'No obvious placeholder markers found.'
          fi

      - name: Install browser for visual QA
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start static preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/merzenich-http.log 2>&1 &
          echo $! > /tmp/merzenich-http.pid
          sleep 2
          curl --fail http://127.0.0.1:4173/index.html > /dev/null

      - name: Capture QA screenshots
        run: |
          mkdir -p qa/after
          cat > .qa-capture.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const base = 'http://127.0.0.1:4173/';

          async function shot(name, hash, viewport, ready) {
            const page = await browser.newPage({ viewport });
            await page.goto(`${base}${hash}`, { waitUntil: 'domcontentloaded' });
            await page.waitForSelector(ready, { timeout: 15000 });
            await page.waitForTimeout(1800);
            await page.screenshot({ path: `qa/after/${name}.png`, fullPage: false });
            await page.close();
          }

          await shot('home-desktop', '#home', { width: 1440, height: 1000 }, '#heroStory h1');
          await shot('home-mobile', '#home', { width: 390, height: 844 }, '#heroStory h1');
          await shot('article-desktop', '#article/einbruch-arnoldsweilerweg-11092026', { width: 1440, height: 1000 }, '#articleView h1');
          await shot('sport-desktop', '#sport', { width: 1440, height: 1000 }, '#archiveGrid .sport-preview');
          await shot('events-desktop', '#termine', { width: 1440, height: 1000 }, '#archiveGrid');

          await browser.close();
          EOF
          node ./.qa-capture.mjs
          rm .qa-capture.mjs
          ls -lh qa/after

      - name: Commit refreshed QA screenshots
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/after/*.png
          if git diff --cached --quiet; then
            echo 'QA screenshots unchanged.'
          else
            git commit -m 'qa: refresh browser screenshots [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
