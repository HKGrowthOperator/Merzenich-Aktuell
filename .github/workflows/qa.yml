name: Merzenich Aktuell QA

on:
  schedule:
    - cron: '15 2 * * *'   # taeglich 04:15 Berlin: abgelaufene Termine raus, Stand zurueck ins Repo
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

# Laeufe auf main nacheinander: zwei gleichzeitige Laeufe haben beide
# Screenshots committet und sich beim Rebase an den Binaerdateien
# festgefahren (Lauf 80). Nicht abbrechen, nur warten.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Validate frontend JavaScript syntax
        run: |
          node --check app.js
          node --check app-fixes.js
          node --check chatgpt-site/assets/app.js
          node --check chatgpt-site/assets/v20.js
          node --check chatgpt-site/assets/ressort-dropdowns.js
          node --check site-source/src/templates/pages.mjs
          node --check site-source/src/templates/layout.mjs
          node --check site-source/src/templates/components.mjs

      - name: Validate JSON content
        run: |
          python3 -m json.tool content.json > /dev/null
          python3 -m json.tool chatgpt-site/api/editorial-current.json > /dev/null
          python3 -m json.tool chatgpt-site/api/sport-current.json > /dev/null
          python3 -m json.tool site-source/content/daten/fussball.json > /dev/null

      - name: Validate WordPress import XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('wordpress-delivery/merzenich-aktuell-import.xml'); print('WXR/XML syntax OK')"

      - name: Verify versioned WordPress source exists
        run: |
          test -f wordpress/theme/merzenich-aktuell/style.css
          test -f wordpress/theme/merzenich-aktuell/functions.php
          test -f wordpress/plugin/merzenich-aktuell-core/merzenich-aktuell-core.php

      - name: Generierte Ansichten nachziehen (Listen, Archiv, Orte, Startseite, Feeds, Suche, Themen, Sport, Markt, Symbolbilder, Assets)
        # Schreibmodus statt reiner Pruefung: Wer Artikel oder Assets pusht, ohne die
        # Generatoren laufen zu lassen, bekommt den Stand hier nachgezogen; der
        # Commit-Schritt unten schreibt das Ergebnis nach main zurueck. Alle
        # Generatoren sind idempotent; der zweite Lauf darf nichts mehr aendern.
        run: |
          node deploy/meldungen.mjs
          node deploy/marke.mjs
          node deploy/symbolbilder.mjs
          node deploy/markt-prerender.mjs
          node deploy/sport-prerender.mjs
          node deploy/suche-index.mjs
          node deploy/thema-prerender.mjs
          node deploy/teaser-bilder.mjs
          node deploy/ortsmarke.mjs
          node deploy/inhaltsindex.mjs
          node deploy/termine-prerender.mjs
          node deploy/ressort-menue.mjs
          node deploy/kopf-theme-einbinden.mjs
          echo '--- nachgezogen:'; git status --short | head -40
      - name: Generatoren idempotent (zweiter Lauf aendert nichts)
        run: |
          node deploy/symbolbilder.mjs --check
          node deploy/markt-prerender.mjs --check
          node deploy/sport-prerender.mjs --check
          node deploy/suche-index.mjs --check
          node deploy/thema-prerender.mjs --check
          node deploy/teaser-bilder.mjs --check
          node deploy/ortsmarke.mjs --check
          node deploy/meldungen.mjs --check
          node deploy/marke.mjs --check
          node deploy/ressort-menue.mjs --check
          node deploy/inhaltsindex.mjs --check
          node deploy/kopf-theme-einbinden.mjs --check

      - name: Symbolbilder fuer Meldungen ohne Foto aktuell?
        run: node deploy/symbolbilder.mjs --check

      - name: Freigabe-, Partner-, Kommentar- und Sport-Logik pruefen
        run: php qa/wordpress/freigabe-test.php && php qa/wordpress/partner-kommentar-test.php && php qa/wordpress/sport-test.php

      - name: Lint versioned WordPress source
        run: |
          PHP_COUNT=$(find wordpress/theme/merzenich-aktuell wordpress/plugin/merzenich-aktuell-core -type f -name '*.php' | wc -l)
          if [ "$PHP_COUNT" -eq 0 ]; then
            echo 'ERROR: Versioned WordPress source contains no PHP files.'
            exit 1
          fi
          while IFS= read -r file; do php -l "$file"; done < <(find wordpress/theme/merzenich-aktuell wordpress/plugin/merzenich-aktuell-core -type f -name '*.php' -print)

      - name: Verify WordPress delivery files exist
        run: |
          test -s wordpress-delivery/merzenich-aktuell-theme.zip
          test -s wordpress-delivery/merzenich-aktuell-core.zip
          test -s wordpress-delivery/merzenich-aktuell-import.xml

      - name: Inspect and lint Theme ZIP
        run: |
          rm -rf /tmp/ma-theme
          mkdir -p /tmp/ma-theme
          unzip -q wordpress-delivery/merzenich-aktuell-theme.zip -d /tmp/ma-theme
          PHP_COUNT=$(find /tmp/ma-theme -type f -name '*.php' | wc -l)
          test "$PHP_COUNT" -gt 0
          while IFS= read -r file; do php -l "$file"; done < <(find /tmp/ma-theme -type f -name '*.php' -print)

      - name: Inspect and lint Core Plugin ZIP
        run: |
          rm -rf /tmp/ma-core
          mkdir -p /tmp/ma-core
          unzip -q wordpress-delivery/merzenich-aktuell-core.zip -d /tmp/ma-core
          PHP_COUNT=$(find /tmp/ma-core -type f -name '*.php' | wc -l)
          test "$PHP_COUNT" -gt 0
          while IFS= read -r file; do php -l "$file"; done < <(find /tmp/ma-core -type f -name '*.php' -print)

      - name: Check for obvious placeholder delivery files
        run: |
          if grep -RniE 'TODO|dummy content|example only' /tmp/ma-theme /tmp/ma-core; then
            echo 'WARNING: Placeholder markers found. Review required.'
          else
            echo 'No obvious placeholder markers found.'
          fi

      - name: Build actual Coolify image
        run: |
          docker build -f deploy/coolify/Dockerfile -t merzenich-aktuell-qa .

      - name: Start actual Coolify delivery
        run: |
          docker run -d --rm --name merzenich-aktuell-qa -p 4173:80 merzenich-aktuell-qa
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          curl --fail http://127.0.0.1:4173/api/sport-current.json | python3 -m json.tool > /dev/null
          # Erst warten, bis der Node-Dienst hinter nginx lauscht (sonst 502 vom Proxy),
          # dann Wetter mit Wiederholung: Open-Meteo antwortet gelegentlich nicht sofort.
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/api/kommentare/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/api/kommentare/status | python3 -m json.tool
          for i in $(seq 1 6); do
            if curl --fail --silent http://127.0.0.1:4173/api/weather.json | python3 -m json.tool > /dev/null; then break; fi
            echo "Wetter-Versuch $i fehlgeschlagen"; sleep 5
          done
          curl --fail http://127.0.0.1:4173/api/weather.json | python3 -m json.tool > /dev/null
          curl --fail 'http://127.0.0.1:4173/api/kommentare/liste?thema=/sport/sc-merzenich-oberzier-3-2/' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and isinstance(d["kommentare"], list)'
          curl --fail http://127.0.0.1:4173/diskussion/ | grep -q 'id="diskussion-app"'
          curl --fail http://127.0.0.1:4173/tipp/ | grep -q 'Tipp · Sponsoring'
          curl --fail http://127.0.0.1:4173/ | grep -q 'href="/tipp/"'
          if curl --fail --silent http://127.0.0.1:4173/ | grep -q '<h2>Sport vor Ort</h2>'; then echo 'Sportblock ist wieder auf der Startseite' && exit 1; fi
          curl --fail http://127.0.0.1:4173/ | grep -q 'data-werbung='
          # Tagesdatum per nginx-SSI in Ortszeit, interne Bereiche gesperrt, Ort-Themen umgeleitet
          curl --fail --silent http://127.0.0.1:4173/ | grep -q "data-today[^>]*>$(TZ=Europe/Berlin date +%d.%m.)<" || (echo 'SSI-Datum fehlt' && exit 1)
          curl --silent -o /dev/null -w '%{http_code}\n' http://127.0.0.1:4173/admin/ | grep -q '^404$'
          curl --silent -o /dev/null -w '%{http_code}\n' http://127.0.0.1:4173/redaktion/ | grep -q '^404$'
          curl --silent -o /dev/null -w '%{http_code} %{redirect_url}\n' http://127.0.0.1:4173/thema/merzenich/ | grep -qE '^301 .*/merzenich/$'
          # Formulare: echte Annahme durch den Dienst (303 auf Danke-Seite), Fehler zurueck mit ?fehler=
          curl --silent -o /dev/null -w '%{http_code} %{redirect_url}\n' -X POST http://127.0.0.1:4173/api/formular -H 'Referer: http://127.0.0.1:4173/korrekturen/' --data-urlencode 'form-name=korrektur' --data-urlencode 'url=https://merzenichaktuell.hk-growthoperator.de/sport/' --data-urlencode 'text=Testhinweis aus der CI-Pruefung' --data-urlencode 'email=qa@merzenich-aktuell.invalid' --data-urlencode 'einwilligung=ja' --data-urlencode 'weiter=/korrekturen/danke/' | grep -E '^303 .*/korrekturen/danke/$'
          curl --silent -o /dev/null -w '%{http_code} %{redirect_url}\n' -X POST http://127.0.0.1:4173/api/formular -H 'Referer: http://127.0.0.1:4173/korrekturen/' --data-urlencode 'form-name=korrektur' --data-urlencode 'text=zu' --data-urlencode 'weiter=/korrekturen/danke/' | grep -E '^303 .*/korrekturen/\?fehler=felder'
          curl --silent -o /dev/null -w '%{http_code}\n' -X POST http://127.0.0.1:4173/api/formular -H 'Accept: application/json' -H 'Content-Type: application/x-www-form-urlencoded' -d 'form-name=korrektur&bot-field=x&url=x&text=spam&email=a@b.cc&einwilligung=ja' | grep -q '^200$'
          # Bildproxy: echtes Wikimedia-Motiv ueber den Dienst (Container hat Netz)
          curl --fail --silent --show-error --max-time 40 -o /tmp/bild.bin -w '%{http_code} %{content_type}\n' 'http://127.0.0.1:4173/api/bild?u=https%3A%2F%2Fcommons.wikimedia.org%2Fwiki%2FSpecial%3AFilePath%2FNeue%2520Streifenwagen%2520f%25C3%25BCr%2520die%2520Polizei%2520vorgestellt.jpg%3Fwidth%3D480' | grep -E '^200 image/'
          curl --fail --silent -o /dev/null -w '%{http_code}\n' 'http://127.0.0.1:4173/api/bild?u=https%3A%2F%2Fexample.com%2Fx.png' | grep -q '^400$' || (echo 'Bildproxy laesst fremde Hosts durch' && exit 1)
          # Jedes in den Assets referenzierte Commons-Motiv muss wirklich existieren: ein falscher
          # Dateiname wuerde sonst still als graue Ersatzflaeche ausgeliefert (Audit-Befund 17.09.).
          grep -ho "commons('[^']*'" chatgpt-site/assets/*.js | sed "s/commons('//;s/'\$//" | sort -u > /tmp/commons-motive.txt
          echo "$(wc -l < /tmp/commons-motive.txt) Commons-Motive referenziert"
          while IFS= read -r datei; do
            u=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote("https://commons.wikimedia.org/wiki/Special:FilePath/"+sys.argv[1]+"?width=480", safe=""))' "$datei")
            curl --fail --silent --max-time 40 -o /dev/null -w '%{http_code} %{content_type}\n' "http://127.0.0.1:4173/api/bild?u=$u" | grep -qE '^200 image/' || (echo "Commons-Motiv nicht abrufbar: $datei" && exit 1)
          done < /tmp/commons-motive.txt

      - name: Install browser for visual QA
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture and verify actual delivery
        run: |
          mkdir -p qa/after
          cat > .qa-capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { readFileSync } from 'node:fs';

          // Der Aufmacher wird von deploy/inhaltsindex.mjs gewaehlt: ein Eintrag in
          // api/editorial-current.json gewinnt, sonst die juengste bebilderte Meldung.
          // Geprueft wird deshalb gegen api/inhalte.json, den Index, den derselbe
          // Lauf geschrieben hat - nicht gegen die optionale Uebersteuerung.
          const index = JSON.parse(readFileSync('chatgpt-site/api/inhalte.json', 'utf8'));
          const expectedHero = String(index.aufmacher?.titel || '').trim();
          if (!expectedHero) throw new Error('inhalte.json: aufmacher.titel fehlt');

          // Sport-QA folgt dem versionierten Datenstand statt historischen
          // Einzelwerten. So bleibt die visuelle Pruefung auch nach einem
          // redaktionellen Ergebnis-/Tabellen-Refresh aussagekraeftig.
          const sportExpected = JSON.parse(readFileSync('chatgpt-site/api/sport-current.json', 'utf8'));
          const expectedScore = String(sportExpected.lastMatch?.score || '').trim();
          const expectedSportDate = new Intl.DateTimeFormat('de-DE', {
            timeZone: 'Europe/Berlin', day: '2-digit', month: '2-digit', year: 'numeric'
          }).format(new Date(sportExpected.lastMatch?.date));
          const expectedHomeRow = sportExpected.table?.find((r) => r.homeTeam || /Merzenich/i.test(r.team || ''));
          if (!expectedScore || !expectedHomeRow) throw new Error('sport-current.json: erwartete QA-Daten fehlen');

          const browser = await chromium.launch({ headless: true });
          const base = 'http://127.0.0.1:4173';

          async function assertNoOverflow(page, name) {
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1);
            if (overflow) throw new Error(`${name}: horizontal overflow`);
          }

          async function shot(name, path, viewport, ready, verify) {
            const page = await browser.newPage({ viewport });
            await page.goto(`${base}${path}`, { waitUntil: 'domcontentloaded' });
            await page.waitForSelector(ready, { timeout: 15000 });
            await page.waitForTimeout(1400);
            await assertNoOverflow(page, name);
            if (verify) await verify(page);
            await page.screenshot({ path: `qa/after/${name}.png`, fullPage: false });
            await page.close();
          }

          await shot('home-desktop', '/', { width: 1440, height: 1000 }, '.front-lead h1', async page => {
            await page.waitForSelector('.header-weather', { timeout: 12000 });
            const title = (await page.locator('.front-lead h1').textContent() || '').trim();
            if (title !== expectedHero) throw new Error(`Homepage hero stale/unexpected: ${title} (erwartet: ${expectedHero})`);
            const unavailable = await page.getByText('Wetterdaten sind derzeit nicht verfügbar.').count();
            if (unavailable) throw new Error('Homepage still shows weather unavailable fallback');
            // Regel aus dem Designstandard 7b: der Aufmacher ist nie bildlos. Vorher
            // wurde ein Logo-Aufmacher still zum Textblock, und die Mitte sah leer aus.
            const heroBild = await page.evaluate(() => {
              const i = document.querySelector('.front-lead .media img');
              return i ? { da: true, geladen: i.complete && i.naturalWidth > 0 } : { da: false };
            });
            if (!heroBild.da) throw new Error('Aufmacher ohne Bildflaeche');
            if (!heroBild.geladen) throw new Error('Aufmacher: Bild laedt nicht');
            // Regel aus dem Designstandard 7b: eine Sektion ist so hoch wie ihr Inhalt
            // plus definierter Abstand. Gemessen am 18.09. standen dort 300 bis 500 px.
            const luecke = await page.evaluate(() => {
              const s = [...document.querySelectorAll('main > section, main > div')];
              let groesste = 0, wo = '';
              for (let i = 1; i < s.length; i++) {
                const a = s[i - 1].getBoundingClientRect(), b = s[i].getBoundingClientRect();
                if (!a.height || !b.height) continue;
                const d = Math.round(b.top - a.bottom);
                if (d > groesste) { groesste = d; wo = (s[i].className || s[i].tagName).slice(0, 40); }
              }
              return { groesste, wo };
            });
            if (luecke.groesste > 96) throw new Error(`Luecke zwischen zwei Sektionen: ${luecke.groesste} px vor ${luecke.wo}`);
            // Die Lueckenpruefung oben sieht nur ZWISCHEN Sektionen. Am 22.09.
            // stand die tote Flaeche INNERHALB der oberen Flaeche: 981 px hohe
            // Redaktionsspalte neben 458 px Servicespalte. Derselbe
            // Schwellwert, andere Achse.
            const oben = await page.evaluate(() => {
              const t = document.querySelector('.portal-top');
              if (!t) return null;
              const tr = t.getBoundingClientRect();
              const spalten = [...t.children]
                .map((c) => ({ was: (c.className || c.tagName).split(' ')[0], hoehe: Math.round(c.getBoundingClientRect().height), rest: Math.round(tr.bottom - c.getBoundingClientRect().bottom) }))
                .filter((c) => c.hoehe > 0);
              return { spalten, groesster: spalten.reduce((a, c) => (c.rest > a.rest ? c : a), { rest: 0, was: '-' }) };
            });
            if (!oben) throw new Error('Obere Flaeche .portal-top nicht gefunden');
            if (oben.groesster.rest > 96) throw new Error(`Tote Flaeche in der oberen Flaeche: ${oben.groesster.rest} px unter ${oben.groesster.was} (${JSON.stringify(oben.spalten)})`);
            // Keine Meldung steht zweimal auf der Seite, kein Motiv oefter als zweimal.
            const wiederholung = await page.evaluate(() => {
              const ids = [...document.querySelectorAll('main article')].map((a) => a.dataset.story).filter(Boolean);
              const doppelt = ids.filter((x, i) => ids.indexOf(x) !== i);
              const z = {};
              for (const i of document.querySelectorAll('main img')) {
                const s = i.getAttribute('src') || '';
                if (/logo|favicon|avatar/i.test(s)) continue;
                z[s] = (z[s] || 0) + 1;
              }
              return { doppelt: [...new Set(doppelt)], motive: Object.entries(z).filter(([, n]) => n > 2).map(([s2, n]) => `${s2.slice(-40)} x${n}`) };
            });
            if (wiederholung.doppelt.length) throw new Error(`Meldung doppelt auf der Startseite: ${wiederholung.doppelt.join(', ')}`);
            if (wiederholung.motive.length) throw new Error(`Motiv mehr als zweimal: ${wiederholung.motive.join(', ')}`);
            const top = await page.locator('.masthead').evaluate(el => el.getBoundingClientRect().top);
            if (Math.abs(top) > 1) throw new Error(`Masthead not attached to browser edge: ${top}`);
            await page.evaluate(() => window.scrollTo(0, 320));
            await page.waitForTimeout(300);
            // Beschluss 16.09.: Der grosse Kopf klappt beim Scrollen ein, die
            // Ressortleiste bleibt oben und zeigt links das kleine Logo (kopf.js).
            const kompakt = await page.evaluate(() => ({
              klasse: document.documentElement.classList.contains('kopf-kompakt'),
              leiste: document.querySelector('.mainnav')?.getBoundingClientRect().top,
              logo: (() => { const e = document.querySelector('.mainnav .compact-brand'); return e ? getComputedStyle(e).display : 'fehlt'; })(),
            }));
            if (!kompakt.klasse) throw new Error('Kopf klappt beim Scrollen nicht ein (html.kopf-kompakt fehlt)');
            if (Math.abs(kompakt.leiste) > 1) throw new Error(`Ressortleiste nicht oben: ${kompakt.leiste}`);
            if (kompakt.logo === 'none' || kompakt.logo === 'fehlt') throw new Error(`Kleines Logo in der Leiste nicht sichtbar: ${kompakt.logo}`);

            // Ressort-Dropdowns: keine Pfeile/Chevrons im Namen. Beim Oeffnen
            // muessen zwei echte, geladene Bildflaechen vorhanden sein.
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForSelector('.navscroll > a[aria-haspopup="true"]', { timeout: 5000 });
            const dropdown = await page.evaluate(async () => {
              const link = document.querySelector('.navscroll > a[href="/nachrichten/"]');
              if (!link) return { fehler: 'Aktuell-Link fehlt' };
              const pseudo = getComputedStyle(link, '::after').content;
              link.click();
              await new Promise((r) => setTimeout(r, 220));
              const panel = document.querySelector('.ressort-dropdown');
              const bilder = [...(panel?.querySelectorAll('.ressort-dropdown__story img') || [])];
              return {
                pseudo,
                offen: !!panel && !panel.hidden && panel.classList.contains('is-open'),
                bilder: bilder.length,
                geladen: bilder.every((img) => img.complete && img.naturalWidth > 0)
              };
            });
            if (dropdown.fehler) throw new Error(dropdown.fehler);
            if (!['none','normal','""'].includes(dropdown.pseudo)) throw new Error('Ressort-Dropdown hat wieder einen Pfeil im Namen: ' + dropdown.pseudo);
            if (!dropdown.offen) throw new Error('Ressort-Dropdown oeffnet nicht');
            if (dropdown.bilder < 2) throw new Error('Ressort-Dropdown ohne zwei bebilderte Teaser: ' + dropdown.bilder);
            if (!dropdown.geladen) throw new Error('Mindestens ein Bild im Ressort-Dropdown laedt nicht');
          });

          await shot('home-mobile', '/', { width: 390, height: 844 }, '.front-lead h1', async page => {
            const title = (await page.locator('.front-lead h1').textContent() || '').trim();
            if (title !== expectedHero) throw new Error(`Mobile hero stale/unexpected: ${title} (erwartet: ${expectedHero})`);
          });

          await shot('article-desktop', '/blaulicht/einbruch-arnoldsweilerweg/', { width: 1440, height: 1000 }, '.article-head h1');

          await shot('sport-desktop', '/sport/', { width: 1440, height: 1000 }, '.sports-module', async page => {
            await page.waitForFunction(
              (score) => document.querySelector('.sports-module')?.textContent?.includes(score),
              expectedScore
            );
            const text = await page.locator('.sports-module').textContent() || '';
            if (!text.includes(expectedSportDate)
              || !text.includes(String(expectedHomeRow.points))
              || !text.includes(String(expectedHomeRow.goals))) {
              throw new Error('Sport module not synchronized to sport-current.json');
            }
          });

          await shot('events-desktop', '/termine/', { width: 1440, height: 1000 }, 'main', async page => {
            const expiredVisible = await page.evaluate(() => [...document.querySelectorAll('[data-event-end]')].some(el => new Date(el.dataset.eventEnd) < new Date() && !el.hidden));
            if (expiredVisible) throw new Error('Expired event still visible as upcoming');
          });

          await browser.close();
          EOF
          node ./.qa-capture.mjs
          rm .qa-capture.mjs
          ls -lh qa/after

      - name: Stop QA delivery
        if: always()
        run: docker rm -f merzenich-aktuell-qa || true

      - name: Commit generierte Ansichten und QA-Screenshots
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.actor != 'github-actions[bot]' && success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Abgelaufene Termine aus Startseite und Terminliste nehmen (Ortszeit); laeuft
          # taeglich per schedule, damit der Stand im Repo nicht veraltet.
          git add -A qa/after chatgpt-site
          if git diff --cached --quiet; then
            echo 'Nichts nachzuziehen.'
          else
            git commit -m 'ci: generierte Ansichten, abgelaufene Termine und QA-Screenshots nachgezogen [skip ci]'
            # Bei Konflikten an den Screenshots gewinnt der frische Stand dieses
            # Laufs (-X theirs = der eingespielte Commit). Schlaegt der Rebase
            # trotzdem fehl, wird er abgebrochen und nicht der QA-Lauf. Materialize
            # und der Marktabgleich schreiben parallel auf main: ein abgelehnter
            # Push wird mit frischem Stand bis zu viermal wiederholt.
            for versuch in 1 2 3 4; do
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                git rebase --abort
                echo 'Screenshots nicht committet: Rebase auf origin/main nicht moeglich.'
                break
              fi
              if git push origin HEAD:main; then break; fi
              sleep $((versuch * 7))
            done
          fi
