name: Materialize Werben Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/werben-bilder.json'
      - 'deploy/werben-bilder.mjs'
      - '.github/workflows/materialize-werben-bilder.yml'

permissions:
  contents: write

concurrency:
  group: materialize-werben-images
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kuratierte Commons-Bilder lokal materialisieren
        run: node deploy/werben-bilder.mjs
      - name: Bildset pruefen
        run: node deploy/werben-bilder.mjs --check
      - name: Assets committen
        run: |
          if [ -z "$(git status --porcelain -- chatgpt-site/assets/werben/)" ]; then
            echo "Keine Aenderungen."
            exit 0
          fi
          git config user.name "Merzenich Aktuell Bot"
          git config user.email "actions@users.noreply.github.com"
          git add chatgpt-site/assets/werben/
          git commit -m "Werben: kuratierte Bildassets materialisieren"
          for versuch in 1 2 3 4; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((versuch * 7))
          done
          exit 1
